name: Enhancement / Proposal
description: Propose a contract improvement, conformance check, security test, or beginner-friendly enhancement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What reliability, policy, conformance, or documentation gap does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the target files (e.g. src/khamseen_os/..., tests/..., docs/...) and behavior.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria & verification command
      description: Verifiable outcomes and exact pytest / CLI commands to validate.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Guardrails check
      options:
        - label: Requires no private repository access, secrets, or proprietary dependencies
          required: true
        - label: Does not duplicate Hermes Agent or Paperclip functionality
          required: true
