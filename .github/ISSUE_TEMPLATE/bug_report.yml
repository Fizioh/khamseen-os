name: Bug report
description: Report a bug in khamseen_os contracts, policy guards, adapters, examples, or docs
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For **security** issues, do not use this form — see [SECURITY.md](https://github.com/Fizioh/khamseen-os/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include file paths, function names, or error tracebacks.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps or pytest command to reproduce
      placeholder: e.g. pytest tests/test_contracts_and_policy.py -k test_name
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core contracts & policy (src/khamseen_os)
        - Runtime conformance & Hermes adapter
        - Examples (examples/engineering-loop)
        - Security & threat model
        - Documentation / CI
    validations:
      required: true
