name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Python 3.11 Tests, Lint, Types & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src/ tests/ examples/ scripts/

      - name: Run Mypy type checker
        run: mypy src/

      - name: Run Pytest suite
        run: pytest -v

      - name: Execute synthetic engineering workflow example
        run: python examples/engineering-loop/run_example.py

      - name: Validate repository links, secrets, and dependency hygiene
        run: python scripts/validate_repo.py
