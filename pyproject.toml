[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "khamseen-os"
version = "0.1.0a1"
description = "Open-source reliability and policy layer for autonomous AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Khamseen Contributors" }]
keywords = ["agents", "reliability", "policy", "verification", "hermes", "autonomy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/Fizioh/khamseen-os"
Issues = "https://github.com/Fizioh/khamseen-os/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
khamseen_os = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_hermes: optional integration tests requiring a live Hermes CLI installation and credentials",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["khamseen_os"]
